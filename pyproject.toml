[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalyze"
version = "0.1.0"
description = "Signal analysis, feature extraction, ML training, and explainability"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "signalyze contributors"}
]
keywords = [
    "signal processing",
    "feature extraction",
    "power spectral density",
    "machine learning",
    "explainability",
    "SHAP",
    "LIME",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "pandas>=1.3.0",
    "shap>=0.44.0",
    "lime>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Repository = "https://github.com/sitakon/signalyze"
"Bug Tracker" = "https://github.com/sitakon/signalyze/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["signalyze*"]
